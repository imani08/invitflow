groups:
  - name: invitaflow-gateway
    rules:
      - alert: InvitaFlowGatewayScrapeUnavailable
        expr: up{job="gateway"} == 0
        for: 2m
        labels:
          severity: critical
          service: gateway
        annotations:
          summary: Prometheus ne peut plus joindre le Gateway
          description: La cible Gateway est indisponible depuis au moins deux minutes.

      - alert: InvitaFlowTelemetryScrapeUnavailable
        expr: up{job=~"prometheus|otel-collector|otel-app-metrics"} == 0
        for: 3m
        labels:
          severity: warning
          service: observability
        annotations:
          summary: Une cible de supervision InvitaFlow est indisponible
          description: Prometheus ne peut pas scruter une cible de Prometheus ou du Collector depuis trois minutes.

      - alert: InvitaFlowGatewayHighHttpErrorRate
        expr: |
          sum(rate(invitaflow_http_requests_total{status_code=~"5.."}[5m]))
          /
          sum(rate(invitaflow_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: Le taux d’erreurs HTTP 5xx du Gateway dépasse 5 %
          description: Plus de 5 % des requêtes du Gateway échouent depuis cinq minutes.

      - alert: InvitaFlowGatewayHttpLatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(invitaflow_http_request_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: La latence p95 du Gateway dépasse 500 ms
          description: Le p95 des requêtes Gateway dépasse 500 ms depuis dix minutes.

  - name: invitaflow-rabbitmq
    rules:
      - alert: InvitaFlowRabbitMQMetricsUnavailable
        expr: up{job="rabbitmq"} == 0
        for: 2m
        labels:
          severity: critical
          service: rabbitmq
        annotations:
          summary: Prometheus ne peut plus joindre les métriques RabbitMQ
          description: Le scrape RabbitMQ échoue depuis au moins deux minutes.

      - alert: InvitaFlowRabbitMQQueueBacklogHigh
        expr: |
          sum by (queue) (
            rabbitmq_detailed_queue_messages_ready{vhost="/",queue!~".*[.](dead|retry)$"}
          ) > 100
        for: 10m
        labels:
          severity: warning
          service: rabbitmq
        annotations:
          summary: Une file RabbitMQ dépasse 100 messages prêts
          description: La file {{ $labels.queue }} dépasse 100 messages prêts depuis dix minutes.

      - alert: InvitaFlowRabbitMQDeadLetterQueueNotEmpty
        expr: |
          sum by (queue) (
            rabbitmq_detailed_queue_messages{vhost="/",queue=~".*[.]dead$"}
          ) > 0
        for: 1m
        labels:
          severity: critical
          service: rabbitmq
        annotations:
          summary: Une dead-letter queue RabbitMQ contient des messages
          description: La file {{ $labels.queue }} contient des messages depuis une minute.

      - alert: InvitaFlowRabbitMQQueueWithoutConsumers
        expr: |
          (rabbitmq_detailed_queue_consumers{vhost="/",queue!~".*[.](dead|retry)$"} == 0)
          and on (queue, vhost)
          (rabbitmq_detailed_queue_messages_ready{vhost="/",queue!~".*[.](dead|retry)$"} > 0)
        for: 3m
        labels:
          severity: warning
          service: rabbitmq
        annotations:
          summary: Une file RabbitMQ en attente n’a aucun consommateur
          description: La file {{ $labels.queue }} contient des messages prêts sans consommateur depuis trois minutes.
