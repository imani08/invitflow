name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure-config:
    name: Validate infrastructure configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate Prometheus configuration and alert rules
        run: docker run --rm -v "$PWD/infrastructure/monitoring:/etc/prometheus:ro" prom/prometheus:v3.6.0 promtool check config /etc/prometheus/prometheus.yml
      - name: Validate Prometheus alert rules
        run: docker run --rm -v "$PWD/infrastructure/monitoring:/etc/prometheus:ro" prom/prometheus:v3.6.0 promtool check rules /etc/prometheus/alerts.yml
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet

  quality:
    name: Lint, types, tests and build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.21.0', '26.10.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.8.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:workspace
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  security:
    name: Dependency and source security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.8.0
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Generate CycloneDX SBOM
        run: pnpm dlx @cyclonedx/cdxgen@12.8.4 -r -o sbom.cdx.json
      - name: Scan for secrets with Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source=/repo --redact --exit-code 1
      - name: Scan source with Semgrep
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.144.0 scan --config p/default --error /src
      - name: Scan filesystem with Trivy
        run: docker run --rm -v "$PWD:/work" aquasec/trivy:0.69.3 fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 /work
      - name: Scan ClamAV runtime image
        run: |
          docker pull clamav/clamav:1.5.4
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image --image-src docker --severity HIGH,CRITICAL --exit-code 1 clamav/clamav:1.5.4
      - name: Scan RabbitMQ runtime image
        run: |
          docker pull rabbitmq:4.1.3-management-alpine
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image --image-src docker --severity HIGH,CRITICAL --exit-code 1 rabbitmq:4.1.3-management-alpine
      - name: Scan Redis runtime image
        run: |
          docker pull redis:8.2.1-alpine
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image --image-src docker --severity HIGH,CRITICAL --exit-code 1 redis:8.2.1-alpine
      - name: Scan Prometheus runtime image
        run: |
          docker pull prom/prometheus:v3.6.0
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image --image-src docker --severity HIGH,CRITICAL --exit-code 1 prom/prometheus:v3.6.0
      - name: Scan PostgreSQL exporter runtime image
        run: |
          docker pull quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image --image-src docker --severity HIGH,CRITICAL --exit-code 1 quay.io/prometheuscommunity/postgres-exporter:v0.20.1
      - name: Scan Redis exporter runtime image
        run: |
          docker pull quay.io/oliver006/redis_exporter:v1.89.0
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image --image-src docker --severity HIGH,CRITICAL --exit-code 1 quay.io/oliver006/redis_exporter:v1.89.0
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('sbom.cdx.json') != ''
        with:
          name: invitaflow-sbom
          path: sbom.cdx.json
          if-no-files-found: error

  containers:
    name: Build and scan ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: admin, dockerfile: apps/admin/Dockerfile }
          - { name: gateway, dockerfile: apps/gateway/Dockerfile }
          - { name: profile, dockerfile: services/profile/Dockerfile }
          - { name: events, dockerfile: services/events/Dockerfile }
          - { name: guests, dockerfile: services/guests/Dockerfile }
          - { name: seating, dockerfile: services/seating/Dockerfile }
          - { name: designs, dockerfile: services/designs/Dockerfile }
          - { name: media, dockerfile: services/media/Dockerfile }
          - { name: analytics, dockerfile: services/analytics/Dockerfile }
          - { name: access, dockerfile: services/access/Dockerfile }
          - { name: ai-design, dockerfile: services/ai-design/Dockerfile }
          - { name: wallet, dockerfile: services/wallet/Dockerfile }
          - { name: billing, dockerfile: services/billing/Dockerfile }
          - { name: payments, dockerfile: services/payments/Dockerfile }
          - { name: notifications, dockerfile: services/notifications/Dockerfile }
          - { name: invitations, dockerfile: services/invitations/Dockerfile }
          - { name: audit, dockerfile: services/audit/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "local/invitaflow-${{ matrix.name }}:${{ github.sha }}" .
      - name: Scan image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image --image-src docker --severity HIGH,CRITICAL --exit-code 1 "local/invitaflow-${{ matrix.name }}:${{ github.sha }}"
