  rendering:
    extends:
      service: invitations
    environment:
      PORT: '3014'
      RENDER_WORKER_ENABLED: 'true'
      INVITATION_OUTBOX_ENABLED: 'false'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3014/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
  traefik:
    image: traefik:v3.5.2
    command:
      [
        '--providers.docker=true',
        '--providers.docker.exposedbydefault=false',
        '--entrypoints.web.address=:80',
        '--api.dashboard=true',
        '--api.insecure=true',
      ]
    volumes: ['/var/run/docker.sock:/var/run/docker.sock:ro']
    networks: [edge]
    ports: ['127.0.0.1:80:80', '127.0.0.1:8088:8080']

networks:
  edge: {}
  application: {}
  data: { internal: true }
  messaging: { internal: true }
  identity: {}
  storage: { internal: true }
  media_scanner: { internal: true }
  clamav_egress: {}
  metrics: { internal: true }
  observability: {}
volumes:
  postgres_data: {}
  redis_data: {}
  rabbitmq_data: {}
  minio_data: {}
  grafana_data: {}
  loki_data: {}
  tempo_data: {}
  prometheus_data: {}
  keycloak_data: {}
configs:
  rabbitmq_definitions:
    file: ./infrastructure/rabbitmq/definitions.json
